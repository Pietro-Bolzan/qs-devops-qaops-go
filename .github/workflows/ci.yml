# Pipeline de integração contínua com quality gates.
# Cada job é um gate: se falhar, o pipeline fica vermelho e o PR não pode
# ser integrado (ver "Proteção da branch main" em docs/quality-gates.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Toda segunda-feira às 06:00 UTC: novas vulnerabilidades são publicadas
  # mesmo sem mudança no código, então o Gate 5 também roda por agenda.
  schedule:
    - cron: "0 6 * * 1"

# Privilégio mínimo: o pipeline só precisa ler o código.
permissions:
  contents: read

# Um novo push no mesmo PR cancela a execução anterior.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTESTSUM_VERSION: v1.13.0
  GOLANGCI_LINT_VERSION: v2.15.0
  GOVULNCHECK_VERSION: v1.9.0
  # Binário oficial do gitleaks, com o SHA-256 publicado na release (cadeia de suprimentos).
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  build:
    name: "Gate 1 · Build"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar código
        uses: actions/checkout@v7

      - name: Instalar Go (versão do go.mod)
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache-dependency-path: go.mod

      - name: Baixar e verificar dependências
        run: |
          go mod download
          go mod verify

      - name: Verificar se go.mod está organizado
        run: |
          go mod tidy
          git diff --exit-code -- go.mod

      - name: Compilar
        run: go build -v ./...

      - name: Análise básica do compilador (go vet)
        run: go vet ./...

      - name: Gerar binário
        run: go build -o bin/tarefas ./cmd/server

      - name: Publicar binário
        uses: actions/upload-artifact@v7
        with:
          name: tarefas-linux-amd64
          path: bin/tarefas
          retention-days: 7

  test:
    name: "Gate 2 · Testes"
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar código
        uses: actions/checkout@v7

      - name: Instalar Go (versão do go.mod)
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache-dependency-path: go.mod

      - name: Instalar gotestsum
        run: go install gotest.tools/gotestsum@${{ env.GOTESTSUM_VERSION }}

      - name: Executar testes unitários e de API (com detector de corrida)
        run: |
          mkdir -p reports
          gotestsum --format testname \
            --junitfile reports/junit.xml \
            --jsonfile reports/test-output.json \
            -- -race -count=1 -covermode=atomic -coverprofile=reports/coverage.out ./...

      - name: Resumo dos testes
        if: always()
        shell: bash
        run: |
          if [ ! -f reports/junit.xml ]; then
            echo "Relatório JUnit não foi gerado." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          header=$(grep -m1 -o '<testsuites[^>]*>' reports/junit.xml)
          attr() { echo "$header" | sed -nE "s/.* $1=\"([^\"]*)\".*/\1/p"; }
          {
            echo "## Gate 2 · Testes"
            echo "| Total | Falhas | Erros | Tempo (s) |"
            echo "|------:|-------:|------:|----------:|"
            echo "| $(attr tests) | $(attr failures) | $(attr errors) | $(attr time) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar relatórios de teste
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: relatorio-testes
          path: reports/
          retention-days: 30

  lint:
    name: "Gate 3 · Análise estática"
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar código
        uses: actions/checkout@v7

      - name: Instalar Go (versão do go.mod)
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache-dependency-path: go.mod

      - name: Preparar pasta de relatórios
        run: mkdir -p reports

      # As regras ficam em .golangci.yml. Os problemas aparecem no log e
      # também como anotações nas linhas do PR.
      - name: Executar golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: --output.text.path=stdout --output.junit-xml.path=reports/golangci-lint.xml

      - name: Publicar relatório de análise estática
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: relatorio-lint
          path: reports/golangci-lint.xml
          retention-days: 30
          if-no-files-found: ignore

  coverage:
    name: "Gate 4 · Cobertura"
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Limites justificados em docs/quality-gates.md (Gate 4).
      COVERAGE_MIN_DOMAIN: "90"
      COVERAGE_MIN_TOTAL: "80"
    steps:
      - name: Baixar código
        uses: actions/checkout@v7

      - name: Instalar Go (versão do go.mod)
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache-dependency-path: go.mod

      # Reaproveita o perfil gerado pelo Gate 2, sem rodar os testes de novo.
      - name: Baixar perfil de cobertura do Gate 2
        uses: actions/download-artifact@v8
        with:
          name: relatorio-testes
          path: reports

      - name: Gerar relatório HTML de cobertura
        run: go tool cover -html=reports/coverage.out -o reports/coverage.html

      - name: Verificar limites de cobertura
        run: ./scripts/coverage-gate.sh reports/coverage.out

      - name: Publicar relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: relatorio-cobertura
          path: reports/coverage.html
          retention-days: 30
          if-no-files-found: ignore

  vulnerabilities:
    name: "Gate 5 · Dependências"
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar código
        uses: actions/checkout@v7

      - name: Instalar Go (versão do go.mod)
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache-dependency-path: go.mod

      - name: Verificar integridade dos módulos
        run: go mod verify

      - name: Instalar govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }}

      # Sai com erro se o código CHAMA uma função vulnerável da biblioteca
      # padrão ou de um módulo de terceiros (base oficial vuln.go.dev).
      - name: Procurar vulnerabilidades conhecidas
        shell: bash
        run: |
          mkdir -p reports
          govulncheck -show verbose ./... | tee reports/govulncheck.txt

      - name: Publicar relatório de vulnerabilidades
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: relatorio-vulnerabilidades
          path: reports/govulncheck.txt
          retention-days: 30
          if-no-files-found: ignore

  secrets:
    name: "Gate 6 · Segredos"
    # Não depende do build: roda desde o início, em paralelo a todos os gates.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Baixar código (histórico completo)
        uses: actions/checkout@v7
        with:
          # Um segredo removido em commit posterior continua no histórico e
          # continua vazado, por isso o gate analisa todos os commits.
          fetch-depth: 0

      - name: Instalar gitleaks (versão fixa e checksum verificado)
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # Sai com erro se encontrar senha, token ou chave em qualquer commit.
      # --redact: o valor encontrado nunca aparece no log nem no relatório.
      - name: Procurar segredos no histórico do Git
        run: |
          mkdir -p reports
          gitleaks git --redact --no-banner --verbose \
            --report-format json --report-path reports/gitleaks.json .

      - name: Resumo da varredura de segredos
        if: always()
        shell: bash
        run: |
          commits=$(git rev-list --count HEAD)
          findings=0
          if [ -f reports/gitleaks.json ]; then
            findings=$(grep -c '"RuleID"' reports/gitleaks.json || true)
          fi
          {
            echo "## Gate 6 · Segredos"
            echo "| Commits analisados | Segredos encontrados |"
            echo "|-------------------:|---------------------:|"
            echo "| $commits | $findings |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar relatório de segredos
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: relatorio-segredos
          path: reports/gitleaks.json
          retention-days: 30
          if-no-files-found: ignore

  smoke:
    name: "Gate 7 · Teste de fumaça"
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Baixar código
        uses: actions/checkout@v7

      # Testa exatamente o binário publicado pelo Gate 1 (o artefato que
      # seria entregue), e não uma nova compilação.
      - name: Baixar binário do Gate 1
        uses: actions/download-artifact@v8
        with:
          name: tarefas-linux-amd64
          path: bin

      - name: Subir o servidor e verificar o fluxo principal
        run: |
          chmod +x bin/tarefas
          ./scripts/smoke-test.sh bin/tarefas

      - name: Publicar log do servidor
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: relatorio-fumaca
          path: reports/smoke-server.log
          retention-days: 30
          if-no-files-found: ignore

  frontend:
    name: "Gate 8 · Frontend"
    # Independente do back-end: começa junto com o Gate 1.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - name: Baixar código
        uses: actions/checkout@v7

      - name: Instalar Node.js (versão do web/.nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      # npm ci instala exatamente o que está no package-lock.json e falha se
      # o lock estiver desatualizado em relação ao package.json.
      - name: Instalar dependências
        run: npm ci

      - name: Auditar dependências (npm audit, severidade alta ou crítica)
        run: npm audit --audit-level=high

      - name: Análise estática e acessibilidade (oxlint + jsx-a11y)
        run: npm run lint

      - name: Verificar tipos (TypeScript)
        run: npm run typecheck

      - name: Testes de componente, acessibilidade (axe-core) e cobertura
        run: npm run test:coverage

      - name: Resumo do frontend
        if: always()
        run: node scripts/ci-summary.mjs

      - name: Gerar build de produção
        run: npx vite build

      - name: Publicar relatórios do frontend
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: relatorio-frontend
          path: web/reports/
          retention-days: 30
          if-no-files-found: ignore

      - name: Publicar build do frontend
        uses: actions/upload-artifact@v7
        with:
          name: esteira-web
          path: web/dist/
          retention-days: 7

  # Decisão final: um único check obrigatório na proteção da branch main.
  # Roda sempre (mesmo com falhas antes) para registrar o resultado de cada gate.
  quality-gate:
    name: "Quality Gate"
    needs: [build, test, lint, coverage, vulnerabilities, secrets, smoke, frontend]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Consolidar resultado dos gates
        shell: bash
        env:
          BUILD: ${{ needs.build.result }}
          TEST: ${{ needs.test.result }}
          LINT: ${{ needs.lint.result }}
          COVERAGE: ${{ needs.coverage.result }}
          VULN: ${{ needs.vulnerabilities.result }}
          SECRETS: ${{ needs.secrets.result }}
          SMOKE: ${{ needs.smoke.result }}
          FRONTEND: ${{ needs.frontend.result }}
        run: |
          icon() {
            case "$1" in
              success) echo "✅ aprovado" ;;
              skipped) echo "⏭️ não executado (gate anterior falhou)" ;;
              cancelled) echo "⚪ cancelado" ;;
              *) echo "❌ reprovado" ;;
            esac
          }
          {
            echo "## Decisão do Quality Gate"
            echo "| Gate | Resultado |"
            echo "|------|-----------|"
            echo "| 1 · Build | $(icon "$BUILD") |"
            echo "| 2 · Testes | $(icon "$TEST") |"
            echo "| 3 · Análise estática | $(icon "$LINT") |"
            echo "| 4 · Cobertura | $(icon "$COVERAGE") |"
            echo "| 5 · Dependências | $(icon "$VULN") |"
            echo "| 6 · Segredos | $(icon "$SECRETS") |"
            echo "| 7 · Teste de fumaça | $(icon "$SMOKE") |"
            echo "| 8 · Frontend | $(icon "$FRONTEND") |"
          } >> "$GITHUB_STEP_SUMMARY"

          for result in "$BUILD" "$TEST" "$LINT" "$COVERAGE" "$VULN" "$SECRETS" "$SMOKE" "$FRONTEND"; do
            if [ "$result" != "success" ]; then
              echo "::error::Quality gate REPROVADO: pelo menos um gate não foi aprovado (veja o resumo)."
              echo "**Decisão: ❌ BLOQUEADO**" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          done
          echo "**Decisão: ✅ APROVADO**" >> "$GITHUB_STEP_SUMMARY"
